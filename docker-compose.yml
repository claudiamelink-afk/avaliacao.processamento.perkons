services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avaliacao_processamento
      POSTGRES_USER: avaliacao
      POSTGRES_PASSWORD: avaliacao_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U avaliacao -d avaliacao_processamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://avaliacao:avaliacao_local@postgres:5432/avaliacao_processamento
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-trocar-antes-de-produzir}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-trocar-por-segredo-longo-antes-de-produzir}
      DB_SSL: "false"
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
